name: npm Publish

on:
  push:
    tags:
      - "sp00ky/v*"

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publishing

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_canary: ${{ steps.meta.outputs.is_canary }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/sp00ky/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # An alpha is its own channel: it must never move `canary`, and above
          # all never `latest`, which is what every default install resolves to.
          if echo "$TAG" | grep -q "alpha"; then
            echo "is_canary=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -q "canary"; then
            echo "is_canary=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=canary" >> "$GITHUB_OUTPUT"
          else
            echo "is_canary=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  validate-versions:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate versions match tag
        run: node scripts/check-version.mjs ${{ needs.prepare.outputs.version }}

      - name: Validate agent skills
        run: pnpm run skills:validate

  publish-packages:
    needs: [prepare, validate-versions]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Upgrade npm for OIDC support
        # Pin to npm@11: npm@latest (12.x) requires node ^22.22.2/^24.15.0, which
        # the pinned runner node (22.14.0) doesn't satisfy → EBADENGINE. npm@11
        # still supports OIDC trusted publishing + --provenance.
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rewrite pnpm `workspace:` deps to the release version. `npm publish`
      # (unlike `pnpm publish`) does NOT rewrite the workspace: protocol, so
      # without this the published packages carry unresolvable workspace:* deps.
      - name: Rewrite workspace deps to release version
        run: |
          V="${{ needs.prepare.outputs.version }}"
          for f in packages/query-builder/package.json packages/ssp-wasm/package.json packages/core/package.json packages/client-solid/package.json packages/client-solid2/package.json apps/devtools-mcp/package.json; do
            jq --arg v "$V" 'reduce ("dependencies","optionalDependencies","peerDependencies") as $k (.; if (.[$k]|type)=="object" then .[$k] |= with_entries(if (.value|type)=="string" and (.value|startswith("workspace:")) then .value=$v else . end) else . end)' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done

      # 1. Build and publish @spooky-sync/query-builder
      - name: Set version — query-builder
        run: jq '.version = "${{ needs.prepare.outputs.version }}"' packages/query-builder/package.json > tmp.json && mv tmp.json packages/query-builder/package.json

      - name: Build query-builder
        run: pnpm --filter @spooky-sync/query-builder build

      - name: Publish query-builder
        working-directory: packages/query-builder
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}

      # 2. Build and publish @spooky-sync/ssp-wasm
      - name: Set version — ssp-wasm
        run: jq '.version = "${{ needs.prepare.outputs.version }}"' packages/ssp-wasm/package.json > tmp.json && mv tmp.json packages/ssp-wasm/package.json

      - name: Build ssp-wasm
        run: pnpm --filter @spooky-sync/ssp-wasm build

      - name: Remove wasm-pack gitignore (prevents npm from including pkg/)
        run: rm -f packages/ssp-wasm/pkg/.gitignore

      - name: Publish ssp-wasm
        working-directory: packages/ssp-wasm
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}

      # 3. Build and publish @spooky-sync/core
      - name: Set version — core
        run: jq '.version = "${{ needs.prepare.outputs.version }}"' packages/core/package.json > tmp.json && mv tmp.json packages/core/package.json

      - name: Build core
        run: pnpm --filter @spooky-sync/core build

      - name: Publish core
        working-directory: packages/core
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}

      # 4. Build and publish @spooky-sync/client-solid
      - name: Set version — client-solid
        run: jq '.version = "${{ needs.prepare.outputs.version }}"' packages/client-solid/package.json > tmp.json && mv tmp.json packages/client-solid/package.json

      - name: Build client-solid
        run: pnpm --filter @spooky-sync/client-solid build

      - name: Publish client-solid
        working-directory: packages/client-solid
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}

      # 4b. Build and publish @spooky-sync/client-solid2 (Solid 2 bindings)
      - name: Set version — client-solid2
        run: jq '.version = "${{ needs.prepare.outputs.version }}"' packages/client-solid2/package.json > tmp.json && mv tmp.json packages/client-solid2/package.json

      - name: Build client-solid2
        run: pnpm --filter @spooky-sync/client-solid2 build

      - name: Publish client-solid2
        working-directory: packages/client-solid2
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}

      # 5. Build and publish @spooky-sync/devtools-mcp
      - name: Set version — devtools-mcp
        run: jq '.version = "${{ needs.prepare.outputs.version }}"' apps/devtools-mcp/package.json > tmp.json && mv tmp.json apps/devtools-mcp/package.json

      - name: Build devtools-mcp
        run: pnpm --filter @spooky-sync/devtools-mcp build

      - name: Publish devtools-mcp
        working-directory: apps/devtools-mcp
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}

  build-cli-binaries:
    needs: [prepare, validate-versions]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: cli-linux-x64
            binary: spky
            cross: false
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: cli-linux-arm64
            binary: spky
            cross: true
          - runner: macos-latest
            target: aarch64-apple-darwin
            package: cli-darwin-arm64
            binary: spky
            cross: false
          - runner: macos-latest
            target: x86_64-apple-darwin
            package: cli-darwin-x64
            binary: spky
            cross: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            package: cli-win32-x64
            binary: spky.exe
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (cross)
        if: matrix.cross
        run: cross build --release -p sp00ky-cli --target ${{ matrix.target }}

      - name: Build binary (native)
        if: "!matrix.cross"
        run: cargo build --release -p sp00ky-cli --target ${{ matrix.target }}

      - name: Copy binary to package directory
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} apps/cli/npm/${{ matrix.package }}/${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: apps/cli/npm/${{ matrix.package }}/${{ matrix.binary }}

  publish-cli-platform-packages:
    needs: [prepare, build-cli-binaries]
    strategy:
      matrix:
        package:
          - cli-linux-x64
          - cli-linux-arm64
          - cli-darwin-x64
          - cli-darwin-arm64
          - cli-win32-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC support
        # Pin to npm@11: npm@latest (12.x) requires node ^22.22.2/^24.15.0, which
        # the pinned runner node (22.14.0) doesn't satisfy → EBADENGINE. npm@11
        # still supports OIDC trusted publishing + --provenance.
        run: npm install -g npm@11

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: apps/cli/npm/${{ matrix.package }}

      - name: Set executable permission
        if: ${{ matrix.package != 'cli-win32-x64' }}
        run: chmod +x apps/cli/npm/${{ matrix.package }}/spky

      - name: Set version
        run: |
          cd apps/cli/npm/${{ matrix.package }}
          jq '.version = "${{ needs.prepare.outputs.version }}"' package.json > tmp.json && mv tmp.json package.json

      - name: Publish platform package
        working-directory: apps/cli/npm/${{ matrix.package }}
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}

  publish-cli:
    needs: [prepare, publish-cli-platform-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC support
        # Pin to npm@11: npm@latest (12.x) requires node ^22.22.2/^24.15.0, which
        # the pinned runner node (22.14.0) doesn't satisfy → EBADENGINE. npm@11
        # still supports OIDC trusted publishing + --provenance.
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version and optionalDependencies
        run: |
          cd apps/cli
          VERSION="${{ needs.prepare.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies = {
              "@spooky-sync/cli-darwin-arm64": $v,
              "@spooky-sync/cli-darwin-x64": $v,
              "@spooky-sync/cli-linux-arm64": $v,
              "@spooky-sync/cli-linux-x64": $v,
              "@spooky-sync/cli-win32-x64": $v
            }
          ' package.json > tmp.json && mv tmp.json package.json

      - name: Build JS bundle
        run: pnpm --filter @spooky-sync/cli build:vite

      - name: Build type declarations
        run: pnpm --filter @spooky-sync/cli build:types

      - name: Publish CLI
        working-directory: apps/cli
        run: npm publish --provenance --access public --tag ${{ needs.prepare.outputs.npm_tag }}
