[package]
name = "sp00ky-cli"
version = "0.0.1-canary.244"
edition = "2021"

[[bin]]
name = "spky"
path = "src/main.rs"

[dependencies]
surrealdb-core = "2.3"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
# Shared with the runtime engine so a cron/DAG that lints is one the engine can
# actually plan — no second parser to drift.
schedule-core = { path = "../../packages/schedule-core" }
regex = "1.12.2"
tar = "0.4"
zstd = "0.13"
tempfile = "3.10"
inquire = "0.7"
# Terminal UI for `spky dev` / migrations: spinners + in-place step lines
# (indicatif) and TTY/NO_COLOR-aware styling (console, indicatif's own dep).
indicatif = "0.18"
console = "0.16"
serde_yaml = "0.9"
openapiv3 = "2.0"
ureq = { version = "2.9", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
ctrlc = "3.4"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
dirs = "6.0"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
open = "5"
ssp-protocol = { path = "../../packages/ssp-protocol" }

[dev-dependencies]
# Used by the docker-gated e2e tests to talk to the throwaway SurrealDB over HTTP.
ureq = { version = "2.9", features = ["json"] }

