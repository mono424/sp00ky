name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (vitest + coverage + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies of core
        run: pnpm --filter @spooky-sync/query-builder build

      - name: Type-check core
        run: pnpm --filter @spooky-sync/core type-check

      - name: Test core with coverage
        run: pnpm --filter @spooky-sync/core test:coverage

  sync-engine:
    name: Rust sync engine, node and scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install RocksDB build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Core and wire protocol regressions
        run: cargo test --locked -p ssp -p ssp-protocol --lib
      - name: Portable node regressions
        run: cargo test --locked -p ssp-node --lib --test node_platform --test view_metrics_flush
      - name: Scheduler delivery and handover regressions
        run: cargo test --locked -p scheduler --lib --test integration --test handover --test handover_two_step
      - name: Native SSP adapter builds
        run: cargo check --locked -p ssp-server
      - name: Portable node builds for wasm
        run: bash scripts/check-portability.sh --locked

  dart-core:
    name: Dart core (native, analysis, codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build host FFI library
        run: bash packages/ssp-ffi/build-native.sh
      - name: Resolve Dart dependencies
        working-directory: packages/spooky_core
        run: dart pub get
      - name: Analyze Dart core and tests
        working-directory: packages/spooky_core
        run: dart analyze lib test
      - name: Run native and codegen tests in separate processes
        working-directory: packages/spooky_core
        env:
          SSP_FFI_PATH: ${{ github.workspace }}/packages/spooky_core/native/linux/libssp_ffi.so
        run: bash tool/run_tests.sh

  dart-flutter:
    name: Dart flutter ${{ matrix.package }} (analysis, tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [spooky_flutter, spooky_push]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: packages/${{ matrix.package }}
        run: flutter pub get
      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: flutter analyze
      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: flutter test

  push-android-build:
    name: spooky_push Android plugin compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # A throwaway host app: the Kotlin only compiles inside one, and no
      # example app is kept in the repo for it.
      - name: Build a debug APK with the plugin
        run: |
          cd "$RUNNER_TEMP"
          flutter create --platforms=android --org dev.sp00ky.ci push_host
          cd push_host
          flutter pub add spooky_push --path "$GITHUB_WORKSPACE/packages/spooky_push"
          flutter build apk --debug
