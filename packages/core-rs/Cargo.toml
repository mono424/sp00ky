[package]
name = "spooky-core"
version = "0.0.1-canary.383"
edition = "2021"
description = "Native Rust core for sp00ky local-first sync (port of the Dart and TypeScript cores)"
license = "MIT"
rust-version = "1.85"

[lib]
name = "spooky_core"

[features]
default = ["remote", "codegen"]
# The SurrealDB WebSocket transport. Without it the client is local-only.
remote = ["dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots"]
# `spooky_core::codegen`: SurrealQL schema -> Rust types, for build scripts.
codegen = ["dep:serde_yaml"]

[dependencies]
# The in-process circuit. No mimalloc: an embedding app owns the allocator.
ssp = { path = "../ssp", default-features = false, features = ["parallel"] }

tokio = { version = "1.47", features = ["rt", "time", "sync", "macros", "net"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
base64 = "0.22"

tokio-tungstenite = { version = "0.28", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
# OpenAPI specs for codegen's typed backend helpers.
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.47", features = ["rt", "time", "sync", "macros", "net", "test-util"] }
tempfile = "3"
# Parses generated Rust in the codegen tests.
syn = { version = "2", features = ["full"] }
