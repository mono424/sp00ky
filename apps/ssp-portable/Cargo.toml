[package]
name = "ssp-portable"
version = "0.0.1-canary.240"
edition = "2024"

# Reference NON-VM host for the SSP node: proves the generic runtime seam by
# driving the SAME `ssp_node::SspNode`/`Runtime` from a hyper accept-loop (not
# axum), with an embedded SurrealDB and a disk-backed CircuitStore + simulated
# eviction. This crate is deliberately Cloudflare-agnostic: swap hyper -> DO
# `fetch`, swap DiskCircuitStore -> DO storage, and the core is unchanged.

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

surrealdb = { version = "3.1.2", default-features = false, features = ["kv-mem"] }

ssp = { path = "../../packages/ssp" }
ssp-protocol = { path = "../../packages/ssp-protocol" }
ssp-node = { path = "../../packages/ssp-node" }

tracing = "0.1"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
