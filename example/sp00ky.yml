# yaml-language-server: $schema=https://sp00ky.cloud/schema/sp00ky.schema.json
mode: singlenode # "singlenode", "cluster", or "surrealism"
cloudApi: https://api-stg.sp00ky.cloud # override Sp00ky Cloud API endpoint
slug: threads-example
surrealdb:
  hosting: external
  endpoint: wss://sp00ky-demo-06fm9vpfdltobduaregfd8ddfo.aws-euw1.surreal.cloud
  namespace: sp00ky-demo
  database: threads
  username: spky
  password:
    vault: DB_PASSWORD

  # hosting defaults to "cloud" — Sp00ky provisions and manages the DB, and
  # generates its own root password. endpoint/username/password are ONLY valid
  # with `hosting: external` (setting them under cloud is a hard error).
  #
  # --- Bring-your-own external DB — uncomment to use ---
  # hosting: external
  # endpoint: "https://my-surreal.example.com"   # required for external
  # Each credential is a literal OR a `{ vault: KEY }` reference resolved from
  # the encrypted vault at deploy time — mix freely, just like `env:` below.
  # username: root                     # literal
  # password: { vault: DB_PASSWORD }   # pulled from the vault (spky env set DB_PASSWORD ...)
schema: ./schema
# Storage layout for the SSP's internal `_00_list_ref` table.
# `dedicated` (default) gives each authenticated user their own
# `_00_list_ref_user_<id>` table; `single` keeps the legacy shared
# `_00_list_ref`. The `_00_query` registration table is global in both
# modes. Dedicated mode works around a SurrealDB v3 LIVE permission
# gap where cross-session INSERT notifications never fire on
# permission-gated tables. Stated explicitly here so the e2e suite's
# config documents itself.
refMode: dedicated
version:
  # Run host-built binaries in dev so `cargo build -p ssp-server -p scheduler`
  # is what actually runs under `pnpm dev:example`. Switch either entry back
  # to a tag (e.g. `ssp: dev`) to fall back to the published Docker image.
  dev:
    ssp:
      path: ../target/debug/ssp-server
    scheduler:
      path: ../target/debug/scheduler
  cloud: canary
buckets:
  - ./schema/src/buckets/profile.surql
logLevel:
  dev: trace
  cloud: info
# ── Server-side schedules ────────────────────────────────────────────────────
# Declarative cron/interval jobs. The scheduler spawns a NEW row in the app's
# outbox table each cycle, so every run is an ordinary atomic job with the usual
# retry/kill/recovery behaviour. Operate them with `spky schedules`.
schedules:
  # Plain cron. `spky schedules trigger nightly-spookify` fires one extra run
  # without shifting the schedule.
  nightly-spookify:
    cron: "0 3 * * *"
    timezone: Europe/Berlin
    backend: api
    route: /spookify
    payload:
      id: thread:demo

  # Fan-out: one job per row the query returns, keyed per row. `skip` means a
  # thread whose previous run is still going is left alone this cycle rather
  # than queueing a second one.
  spookify-threads:
    every: 5m
    backend: api
    route: /spookify
    forEach:
      query: SELECT id FROM thread WHERE archived = false
      key: id
    concurrency: skip
    retry:
      max: 3
      strategy: linear
    timeout: 120s

# ── Server-side workflows ────────────────────────────────────────────────────
# A DAG of steps, each step an atomic job. Steps with no `dependsOn` are roots
# and run in parallel; a step listing several is a fan-in join. A step reads its
# dependencies' outputs from `payload.steps.<name>`.
workflows:
  share-and-spookify:
    schedule:
      cron: "0 6 * * 1"
    steps:
      accept-shares:
        backend: api
        route: /share/accept
      spookify:
        backend: api
        route: /spookify
        dependsOn: [accept-shares]
    onFailure: halt

clientTypes:
  - format: typescript
    output: ./app-solid/src/schema.gen.ts
  - format: dart
    output: ./client-dart/src/db/models.dart
apps:
  web:
    type: frontend
    dev:
      type: npm
      script: dev:app
    deploy:
      dockerfile: ./app-solid/Dockerfile
      context: ../
      port: 80
      # Free/Cloudflare plan: build the SPA and host it on Cloudflare Workers
      # Static Assets (no Docker image). VITE_DB_ENDPOINT is baked from the
      # external SurrealDB endpoint above so the SPA syncs directly against it.
      static:
        build: pnpm --filter @example/app-solid build
        dir: example/app-solid/dist
    env:
      dev: '.env.local'
      # `vault:` pulls these from the encrypted vault. For automatic deploys
      # (push-to-deploy), enable CI access once with `spky env share-ci`
      # so the build pipeline can read them; otherwise they're only injected on
      # manual `spky deploy`.
      vault:
        - 'VITE_DB_ENDPOINT'
  api:
    type: backend
    scope: devOnly
    # hosting: cloud    # "cloud" (default) or "external" (self-hosted at baseUrl)
    spec: ./api/openapi.yml
    baseUrl: http://host.docker.internal:3660
    dev:
      type: npm
      script: dev
      workdir: ./api
    deploy:
      dockerfile: ./api/Dockerfile
      context: ../
      port: 3660
      healthcheck: /health
    auth:
      type: token
      token: THIS_IS_TOP_SECRET
    method:
      type: outbox
      table: job
      schema: ./schema/src/outbox/api.surql
      # How many of this table's jobs run at once. Default 1 (serial).
      # Anything over the limit waits as a `pending` row and is admitted
      # oldest-first as slots free — the outbox is the queue.
      concurrency: 4
    env:
      dev: '.env.local'
      cloud:
        vault:
          - 'ANTHROPIC_API_KEY'
          - 'API_AUTH_TOKEN'
  # `type: docker` app — a container `spky dev` runs alongside SurrealDB/SSP on
  # the `sp00ky-dev-net` network (reachable by its app name). `scope: devOnly`
  # = local-only sidecar, never deployed. Fields: image (required), ports, args
  # (container command), env, volumes (`-v`; `${PROJECT_DIR}` = abs dir of this
  # file), workdir (`-w`), dependsOn (start order — validated for unknown names
  # & cycles), healthcheck (HTTP path polled on the first published host port so
  # dependents wait for real readiness).
  mailpit:
    type: docker
    scope: devOnly
    image: axllent/mailpit:latest
    ports: [1025, 8025]
    healthcheck: /readyz
  # A worker (run from source) that only starts once mailpit is ready.
  worker:
    type: docker
    scope: devOnly
    image: golang:1.22
    workdir: /src/worker
    args: ['go', 'run', '.']
    dependsOn: [mailpit]
    volumes:
      - '${PROJECT_DIR}:/src'
      - 'gomod:/go'
    env:
      SMTP_ADDR: 'mailpit:1025'
