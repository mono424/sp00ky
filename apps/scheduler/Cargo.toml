[package]
name = "scheduler"
version = "0.0.1-alpha.1"
edition = "2021"

[dependencies]
schedule-core = { path = "../../packages/schedule-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
surrealdb = { version = "3.1.2", default-features = false, features = ["kv-rocksdb", "protocol-http", "rustls"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
anyhow = "1"
axum = "0.7"
tower-http = { version = "0.6", features = ["timeout", "fs", "cors"] }
# `util` for `ServiceExt::oneshot`: the MCP server dispatches tool calls
# through the admin router in-process rather than re-implementing handlers.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
ssp-protocol = { path = "../../packages/ssp-protocol" }
maintenance = { path = "../../packages/maintenance" }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
flate2 = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
sha2 = "0.10"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
