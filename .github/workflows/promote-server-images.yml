name: Promote server images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Built immutable image tag to promote to canary
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image tag
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$IMAGE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]] || exit 1
          [ "$IMAGE_VERSION" != canary ] && [ "$IMAGE_VERSION" != latest ]
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote existing multi-platform images
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          for role in scheduler ssp; do
            docker buildx imagetools inspect "mono424/spooky-$role:$IMAGE_VERSION"
          done
          for role in scheduler ssp; do
            docker buildx imagetools create \
              -t "mono424/spooky-$role:canary" "mono424/spooky-$role:$IMAGE_VERSION"
          done
