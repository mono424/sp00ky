openapi: 3.1.0
paths:
  /spookify:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                count: { type: integer }
                ratio: { type: number }
                dry_run: { type: boolean }
                options: { type: object }
              required: [id]
  /noargs:
    post: {}
