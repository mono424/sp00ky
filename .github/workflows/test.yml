name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (vitest + coverage + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies of core
        run: pnpm --filter @spooky-sync/query-builder build

      - name: Type-check core
        run: pnpm --filter @spooky-sync/core type-check

      - name: Test core with coverage
        run: pnpm --filter @spooky-sync/core test:coverage
