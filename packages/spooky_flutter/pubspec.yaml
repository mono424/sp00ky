name: spooky_flutter
description: Flutter bindings for spooky_core - render bucket files through the local blob cache, WebRTC for peer to peer channels.
version: 0.0.1-canary.366
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  spooky_core:
    path: ../spooky_core
  # WebRTC data channels for `-- @channel` tables (`flutterWebRtc`).
  flutter_webrtc: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
