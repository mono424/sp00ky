<style>
  :root{
    --paper:#EBE6D3; --paper-2:#F2EEDF; --paper-3:#E2DCC5;
    --ink:#26241a; --ink-soft:rgba(38,36,26,.62); --ink-faint:rgba(38,36,26,.28);
    --line:rgba(38,36,26,.85); --grid:rgba(38,36,26,.10);
    --accent:#6d4fc0; --accent-soft:rgba(109,79,192,.14); --accent-line:#5b3fae;
    --code-bg:#26241a; --code-ink:#EBE6D3;
    --sel:#26241a; --sel-ink:#EBE6D3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151220; --paper-2:#1B1729; --paper-3:#120F1B;
      --ink:#DCD6C0; --ink-soft:rgba(220,214,192,.62); --ink-faint:rgba(220,214,192,.28);
      --line:rgba(220,214,192,.85); --grid:rgba(220,214,192,.10);
      --accent:#A98EF5; --accent-soft:rgba(169,142,245,.16); --accent-line:#BCA5FA;
      --code-bg:#0D0B14; --code-ink:#D6D0BC;
      --sel:#DCD6C0; --sel-ink:#151220;
    }
  }
  :root[data-theme="dark"]{
    --paper:#151220; --paper-2:#1B1729; --paper-3:#120F1B;
    --ink:#DCD6C0; --ink-soft:rgba(220,214,192,.62); --ink-faint:rgba(220,214,192,.28);
    --line:rgba(220,214,192,.85); --grid:rgba(220,214,192,.10);
    --accent:#A98EF5; --accent-soft:rgba(169,142,245,.16); --accent-line:#BCA5FA;
    --code-bg:#0D0B14; --code-ink:#D6D0BC;
    --sel:#DCD6C0; --sel-ink:#151220;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:13px; line-height:1.55;
    display:flex; flex-direction:column; overflow:hidden;
    overscroll-behavior:none;
  }
  .lbl{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}
  /* ---------- header ---------- */
  header{
    display:flex; align-items:stretch; border-bottom:1px solid var(--line);
    flex:none; overflow-x:auto; scrollbar-width:none;
  }
  header::-webkit-scrollbar{display:none}
  .stat{padding:9px 16px 8px; border-right:1px solid var(--ink-faint); min-width:max-content}
  .stat b{display:block; font-size:14px; font-weight:600; margin-top:1px; font-variant-numeric:tabular-nums}
  .hbtns{margin-left:auto; display:flex; align-items:center; gap:8px; padding:0 14px}
  button{
    font:inherit; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    background:var(--paper); color:var(--ink); border:1px solid var(--line);
    padding:6px 12px; cursor:pointer; white-space:nowrap;
  }
  button:hover{background:var(--paper-3)}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button.primary{background:var(--sel); color:var(--sel-ink)}
  button.primary:hover{background:var(--sel)}
  /* ---------- layout ---------- */
  #layout{flex:1; display:flex; min-height:0}
  /* sidebar */
  #sidebar{
    width:236px; flex:none; border-right:1px solid var(--line);
    overflow-y:auto; padding:12px 10px 40px;
  }
  #sidebar h2{font-size:10px; letter-spacing:.14em; font-weight:500; color:var(--ink-soft); margin:16px 4px 6px}
  #sidebar h2:first-child{margin-top:2px}
  .navitem{
    display:flex; gap:8px; align-items:baseline; width:100%;
    border:1px solid var(--ink-faint); background:transparent; color:var(--ink);
    padding:6px 8px; margin-bottom:4px; text-align:left; cursor:pointer;
    font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; line-height:1.35;
  }
  .navitem:hover{background:var(--accent-soft); border-color:var(--accent)}
  .navitem.active{background:var(--sel); color:var(--sel-ink); border-color:var(--sel)}
  .navitem .code{font-size:9.5px; color:var(--ink-soft); flex:none; width:20px}
  .navitem.active .code{color:var(--sel-ink); opacity:.7}
  .navitem .n{margin-left:auto; font-size:9.5px; color:var(--ink-soft); flex:none}
  .navitem.active .n{color:var(--sel-ink); opacity:.7}
  /* stage */
  #stage{flex:1; position:relative; min-width:0; background:var(--paper)}
  #stage svg{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; -webkit-tap-highlight-color:transparent}
  #stage svg.panning{cursor:grabbing}
  #crumb{
    position:absolute; top:10px; left:12px; display:none;
  }
  #zoombtns{position:absolute; top:10px; right:12px; display:flex; flex-direction:column; gap:6px}
  #zoombtns button{width:30px; padding:4px 0; text-align:center}
  #hint{
    position:absolute; left:0; right:0; bottom:0; padding:6px 14px;
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);
    pointer-events:none; background:linear-gradient(to top, var(--paper), transparent);
  }
  #tracebox{
    position:absolute; left:12px; bottom:34px; max-width:420px; display:none;
    border:1px solid var(--line); background:var(--paper-2); padding:10px 12px;
  }
  #tracebox .lbl{margin-bottom:2px}
  #traceledger{
    display:none; margin-top:7px; padding:4px 8px; font-size:11px;
    background:var(--code-bg); color:var(--code-ink); border:1px solid var(--ink-faint);
    font-variant-numeric:tabular-nums; overflow-x:auto; white-space:nowrap;
  }
  /* panel */
  #panel{
    width:400px; flex:none; border-left:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; background:var(--paper-2);
  }
  #tabs{display:flex; flex:none; border-bottom:1px solid var(--line)}
  #tabs button{flex:1; border:none; border-right:1px solid var(--ink-faint); padding:9px 0; background:var(--paper-2)}
  #tabs button:last-child{border-right:none}
  #tabs button.on{background:var(--sel); color:var(--sel-ink)}
  #panelbody{overflow-y:auto; padding:16px 18px 60px}
  #panelbody .eyebrow{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:4px}
  #panelbody h1{font-size:19px; font-weight:600; line-height:1.25; letter-spacing:.01em; text-wrap:balance}
  #panelbody .tagline{color:var(--ink-soft); font-size:12px; margin:4px 0 14px; font-style:italic}
  #panelbody h3{
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:500;
    color:var(--ink-soft); border-bottom:1px solid var(--ink-faint);
    padding-bottom:3px; margin:18px 0 8px;
  }
  #panelbody p{margin-bottom:10px}

  s_joinw: {cap:'packages/ssp/src/operator/join.rs:39 · join weights multiply (ring), so a −1 retracts joined rows', code:[
'/// Hash-join: probe left against right using the join condition.',
'/// Output weight = left_weight * right_weight (ring multiplication).',
'...',
'if let Some(matches) = right_index.get(&hash_value(l_field)) {',
'    for (_r_key, &r_weight, r_field) in matches {',
'        if compare_values(l_field, *r_field) == Ordering::Equal {',
'            let w = l_weight * r_weight;',
'            *out.entry(l_key.clone()).or_insert(0) += w;',
'        }',
'    }',
'}',
'// Clean up zero weights',
'out.retain(|_, w| *w != 0);']},
  s_joinstep: {cap:'packages/ssp/src/operator/join.rs:88 · the three-term delta rule: ΔA⋈B + A⋈ΔB + ΔA⋈ΔB', code:[
'fn step(&mut self, input_deltas: &[&ZSet], store: &Store, _ctx: Option<&Sp00kyValue>) -> ZSet {',
'    let delta_a = input_deltas[0];',
'    let delta_b = input_deltas[1];',
'',
'    // Three-term join delta rule',
'    let term1 = Self::hash_join(delta_a, &self.right_state, &self.condition, store);',
'    let term2 = Self::hash_join(&self.left_state, delta_b, &self.condition, store);',
'    let term3 = Self::hash_join(delta_a, delta_b, &self.condition, store);',
'',
'    // Update Z⁻¹ integration state AFTER computing delta',
'    self.left_state.add(delta_a);',
'    self.right_state.add(delta_b);',
'',
'    let mut result = term1;',
'    result.add(&term2);',
'    result.add(&term3);',
'    result',
'}']},

 tag:'packages/ssp · incremental view maintenance, 16.3k LOC',

zset:{title:'Inside a Query Plan · Z-sets', of:'circuit', intro:'The lowest layer. One concrete plan (SELECT post WHERE published = true, joined to author) and how an UPDATE flows through it as weighted deltas. Press ▶ to run the example.',
 nodes:[
  {code:'ZL', name:'Z-set Ledger', x:0,y:0.4,w:1.9,d:1.9,h:1.0, tag:'rows as integer weights', what:'<p>A Z-set is a map from row key to an integer weight. The database itself is a Z-set where every weight is 1. A change batch is a Z-set with mixed signs: CREATE is +1, DELETE is −1, and an UPDATE is <mark>−1 for the old row plus +1 for the new one</mark> at the same key, which nets to weight 0 with changed content (a content update). Zero-weight entries vanish, keeping the map sparse.</p><p>Addition of Z-sets is the group operation everything composes over; join multiplication makes it a ring, and that ring structure is why deletions propagate through joins for free.</p>', snips:['s_zsetdef','s_zsetadd']},
  {code:'SC', name:'Scan post', x:2.8,y:1.8,w:1.7,d:1.7,h:0.9, tag:'the leaf: a delta enters', what:'<p>The step delivers the per-table delta Z-set to every Scan leaf that reads this table. For our example UPDATE of post:1 from draft to published, the delta is two entries at one key: the retraction of the old row and the insertion of the new one. Staged deletes in the row arena let downstream predicates still read the old row while processing its −1.</p>', snips:[]},
  {code:'PF', name:'Filter (WHERE + perms)', x:5.4,y:0.6,w:1.9,d:1.9,h:1.0, tag:'weight passes if predicate holds', what:'<p>A filter is weight-agnostic: it evaluates its predicate per key and passes the weight through untouched, whatever the sign. Both signs of an update get re-checked independently: the old draft row fails <code>published = true</code> so its −1 is dropped; the new row passes so its +1 continues. That asymmetry IS the membership change. Injected permission predicates are just more of these filters.</p>', snips:['s_filterop']},
  {code:'JN', name:'Join author', x:5.8,y:3.6,w:1.9,d:1.9,h:1.0, tag:'weights multiply', what:'<p>Join output weight is the ring product left × right. A +1 meeting a +1 emits +1; a −1 meeting a +1 emits −1, which is how deleting an author automatically retracts every joined post with zero special-case code. Incrementality comes from the three-term delta rule: ΔA⋈B + A⋈ΔB + ΔA⋈ΔB, with each side integrating the other\'s history (the Z⁻¹ state).</p>', snips:['s_joinw','s_joinstep']},
  {code:'DS', name:'Distinct / Membership', x:8.4,y:2,w:1.9,d:1.9,h:1.0, tag:'sign becomes presence', what:'<p>The view accumulates weights per key and collapses them to presence: accumulated weight above zero means the row is in the view exactly once, at or below zero means absent. This is where multiset arithmetic becomes the yes/no answer a UI needs. evaluate_key re-checks keys whose weight netted to 0 but whose content changed, so a predicate flip without a weight change still moves membership.</p>', snips:['s_view']},

/* ================= iso renderer ================= */
const KX=46, KY=23, KZ=34;
const P=(x,y,z)=>[(x-y)*KX,(x+y)*KY-(z||0)*KZ];
const svg=document.getElementById('iso'), world=document.getElementById('world');
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t); for(const k in a)e.setAttribute(k,a[k]); return e;};
const poly=pts=>pts.map(p=>p.join(',')).join(' ');

function boxFaces(g,x,y,w,d,h,z0){
  z0=z0||0;
  const A=P(x,y,z0+h),B=P(x+w,y,z0+h),C=P(x+w,y+d,z0+h),Dp=P(x,y+d,z0+h);
  const C0=P(x+w,y+d,z0),D0=P(x,y+d,z0),B0=P(x+w,y,z0);
  g.appendChild(el('polygon',{points:poly([Dp,C,C0,D0]),class:'face side'}));
  g.appendChild(el('polygon',{points:poly([C,B,B0,C0]),class:'face side'}));
  g.appendChild(el('polygon',{points:poly([A,B,C,Dp]),class:'face top'}));
}
function drawNode(n,scale){
  const g=el('g',{class:'node'+(n.ext?' ext':'')}); g.dataset.id=n.id;
  if(n.shape==='stack'){
    const layers=5, lh=n.h/layers;
    for(let i=0;i<layers;i++) boxFaces(g,n.x,n.y,n.w,n.d,lh*0.62,i*lh);
  } else if(n.shape==='row'){
    for(let i=0;i<3;i++) boxFaces(g,n.x+i*0.75,n.y+i*0.42,n.w,n.d,n.h,0);
  } else boxFaces(g,n.x,n.y,n.w,n.d,n.h,0);
  const topC=P(n.x+n.w/2,n.y+n.d/2,n.h*(n.shape==='stack'?1.02:1));
  const t=el('text',{x:topC[0],y:topC[1]+4,'text-anchor':'middle',class:'nodelbl'});
  t.textContent=n.code+(n.scene?' »':''); g.appendChild(t);
  const base=P(n.x+n.w/2,n.y+n.d+0.32,0);
  const t2=el('text',{x:base[0],y:base[1]+10,'text-anchor':'middle',class:'nodename'});
  t2.textContent=n.name; g.appendChild(t2);
  return g;
}
function centerOf(n){return [n.x+n.w/2, n.y+n.d/2];}
function drawEdge(e,a,b){
  const [ax,ay]=centerOf(a), [bx,by]=centerOf(b);
  const pts=[[ax,ay]];
  if(Math.abs(ax-bx)>0.4 && Math.abs(ay-by)>0.4) pts.push([bx,ay]);
  pts.push([bx,by]);
  const proj=pts.map(p=>P(p[0],p[1],0));
  const dpath='M'+proj.map(p=>p.join(' ')).join(' L');
  const g=el('g',{class:'edgegrp'});
  const path=el('path',{d:dpath,class:'edge'+(e.dashed?' dashed':'')});
  path.dataset.eid=e.id||''; g.appendChild(path);
  g.appendChild(el('path',{d:dpath,class:'edgehit'}));
  // arrowhead
  const n1=proj[proj.length-2], n2=proj[proj.length-1];
  const ang=Math.atan2(n2[1]-n1[1],n2[0]-n1[0]);
  const L=9, sp=0.5;
  const tip=[n2[0]-Math.cos(ang)*14, n2[1]-Math.sin(ang)*14];
  const a1=[tip[0]-L*Math.cos(ang-sp), tip[1]-L*Math.sin(ang-sp)];
  const a2=[tip[0]-L*Math.cos(ang+sp), tip[1]-L*Math.sin(ang+sp)];
  g.appendChild(el('polygon',{points:poly([tip,a1,a2]),fill:'currentColor',class:'ah'}));
  // diamond at midpoint + label
  const mid=proj.length===3?proj[1]:[(proj[0][0]+proj[1][0])/2,(proj[0][1]+proj[1][1])/2];
  const dm=el('rect',{x:mid[0]-3.2,y:mid[1]-3.2,width:6.4,height:6.4,transform:`rotate(45 ${mid[0]} ${mid[1]})`,class:'diam'});
  dm.dataset.eid=e.id||''; g.appendChild(dm);
  if(e.label){
    const lt=el('text',{x:mid[0]+9,y:mid[1]-5,class:'edgelbl'});
    lt.textContent=e.label;
    const bg=el('rect',{class:'lblbg'});
    g.appendChild(bg); g.appendChild(lt);
    requestAnimationFrame(()=>{ try{const bb=lt.getBBox(); bg.setAttribute('x',bb.x-3);bg.setAttribute('y',bb.y-1);bg.setAttribute('width',bb.width+6);bg.setAttribute('height',bb.height+2);}catch(_){}});
  }
  return {g, path};
}
function drawGrid(minX,maxX,minY,maxY){
  const g=el('g',{});
  for(let x=Math.floor(minX);x<=maxX;x+=2){
    const a=P(x,minY,0),b=P(x,maxY,0);
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'gridline'}));
  }
  for(let y=Math.floor(minY);y<=maxY;y+=2){
    const a=P(minX,y,0),b=P(maxX,y,0);
    g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'gridline'}));
  }
  return g;
}

/* view state */
let view={tx:0,ty:0,k:1}, currentScene=null, selected=null, edgePaths={}, edgeMeta={}, sceneStack=[];
function openScene(key){ if(!SCENES[key])return; sceneStack.push(key); renderScene(key); }
function goBack(){
  sceneStack.pop();
  const prev=sceneStack[sceneStack.length-1];
  prev?renderScene(prev):renderOverview();
}
function applyView(){world.setAttribute('transform',`translate(${view.tx} ${view.ty}) scale(${view.k})`);}
function fitTo(nodes,pad){
  pad=pad||70;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n=>{
    [[n.x,n.y,0],[n.x+n.w+2.3,n.y,0],[n.x,n.y+n.d,0],[n.x+n.w,n.y+n.d+0.8,0],[n.x+n.w/2,n.y+n.d/2,(n.h||1)+0.4]].forEach(c=>{
      const p=P(c[0],c[1],c[2]); x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);
    });
  });
  const W=svg.clientWidth||900, H=svg.clientHeight||600;
  const k=Math.min((W-pad*2)/(x1-x0), (H-pad*2)/(y1-y0), 1.6);
  view.k=k; view.tx=(W-(x1+x0)*k)/2; view.ty=(H-(y1+y0)*k)/2 + 6;
  applyView();
}

function groupLabel(nodes,gid,label){
  const ns=nodes.filter(n=>n.group===gid); if(!ns.length)return null;
  // place label above the top-most node of the group
  let best=ns[0], bestY=1e9;
  ns.forEach(n=>{const p=P(n.x+n.w/2,n.y-0.6,0); if(p[1]<bestY){bestY=p[1];best=n;}});
  const p=P(best.x+best.w/2,best.y-0.75,0);
  const t=el('text',{x:p[0],y:p[1],class:'grouplbl','text-anchor':'middle'});
  t.textContent=label.toUpperCase();
  return t;
}

function renderOverview(){
  currentScene=null; sceneStack=[]; world.innerHTML=''; edgePaths={}; edgeMeta={};
  document.getElementById('crumb').style.display='none';
  world.appendChild(drawGrid(-3,19,-4,14));
  EDGES.forEach(e=>{
    const a=NODES.find(n=>n.id===e.from), b=NODES.find(n=>n.id===e.to);
    const {g,path}=drawEdge(e,a,b); world.appendChild(g); edgePaths[e.id]=path; edgeMeta[e.id]={from:e.from,to:e.to};
  });
  const sorted=[...NODES].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  sorted.forEach(n=>world.appendChild(drawNode(n)));
  GROUPS.forEach(gr=>{const t=groupLabel(NODES,gr.id,gr.label); if(t)world.appendChild(t);});
  fitTo(NODES);
  bindNodes(id=>NODES.find(n=>n.id===id));
}
function renderScene(key){
  stopTrace();
  const sc=SCENES[key]; if(!sc)return;
  if(sceneStack[sceneStack.length-1]!==key) sceneStack.push(key);
  currentScene=key; world.innerHTML=''; edgePaths={}; edgeMeta={};
  document.getElementById('crumb').style.display='block';
  world.appendChild(drawGrid(-2,14,-2,9));
  const nodes=sc.nodes.map((n,i)=>({...n, id:key+'#'+i, group:'scene'}));
  sc.edges.forEach((e,i)=>{
    const eid='sE'+i;
    const {g,path}=drawEdge({id:eid,label:e.label,dashed:e.dashed},nodes[e.from],nodes[e.to]);
    world.appendChild(g); edgePaths[eid]=path; edgeMeta[eid]={from:nodes[e.from].id,to:nodes[e.to].id};
  });
  [...nodes].sort((a,b)=>(a.x+a.y)-(b.x+b.y)).forEach(n=>world.appendChild(drawNode(n)));
  const p=P(nodes[0].x, -1.6, 0);
  const t=el('text',{x:p[0],y:p[1],class:'grouplbl'}); t.textContent=sc.title.toUpperCase();
  world.appendChild(t);
  fitTo(nodes);
  bindNodes(id=>{const i=+id.split('#')[1]; return {...sc.nodes[i], id, sceneNode:true};});
  showScenePanel(sc);
}

const panelbody=document.getElementById('panelbody');
let tab='what', panelNode=null;
function fmtSnips(keys){
  return (keys||[]).map(k=>{
    const s=SNIPS[k]; if(!s)return '';
    return `<div class="snip"><div class="cap">${s.cap}</div><pre data-snip="${k}"></pre></div>`;
  }).join('');
}
function fillSnips(){
  panelbody.querySelectorAll('pre[data-snip]').forEach(pre=>{
    const s=SNIPS[pre.dataset.snip]; if(s) pre.textContent=s.code.join('\n');

}
function showNodePanel(n){

function showScenePanel(sc){

/* welcome panel */
function showWelcome(){
  panelbody.innerHTML=`
    <div class="eyebrow">sp00ky</div>
    <h1>The Reactive, Local-First Framework for SurrealDB</h1>
    <div class="tagline">how a mutation becomes everyone else's repaint</div>
    <h3>What this is</h3>
    <p>sp00ky puts a <mark>DBSP incremental circuit</mark> on both sides of the wire. Server-side, the SSP sidecar consumes every mutation and materializes query results as graph edges inside SurrealDB. Client-side, the <em>same Rust crate</em> (compiled to wasm or FFI) maintains the same views locally, so optimistic writes paint before any network.</p>
    <p>There is no custom realtime protocol: <mark>SurrealDB is the message bus</mark>. Clients hold one WebSocket to the database; the SSP is reached through server functions and DB events; answers come back as LIVE notifications on membership-edge tables.</p>

    <h3>The five hosts of one circuit</h3>
    <ul><li>SSP container (server)</li><li>browser, via ssp-wasm</li><li>Flutter, via ssp-ffi</li><li>Cloudflare Durable Object (ssp-cf)</li><li>inside SurrealDB itself (surrealism module, parked)</li></ul>`;

/* ================= interactions ================= */
let currentResolver=null;
function bindNodes(resolve){
  currentResolver=resolve;
  world.querySelectorAll('g.node').forEach(g=>{
    g.addEventListener('pointerenter',ev=>{ if(ev.pointerType!=='mouse')return; if(!selected && !tracing){ const n=resolve(g.dataset.id); n.sceneNode?showSceneNodePanel(n):showNodePanel(n);} });
  });
}
function tapAt(clientX,clientY){
  // pointer capture retargets click to the svg, so selection happens here
  const t=document.elementFromPoint(clientX,clientY);
  const g=t&&t.closest?t.closest('g.node'):null;
  if(g&&currentResolver) selectNode(g.dataset.id,currentResolver);
  else clearSel();
}
function selectNode(id,resolve){
  stopTrace();
  selected=id;
  world.querySelectorAll('g.node').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));
  document.querySelectorAll('.navitem').forEach(x=>x.classList.toggle('active',x.dataset.id===id));
  const n=resolve(id);
  n.sceneNode?showSceneNodePanel(n):showNodePanel(n);
}
function clearSel(){
  selected=null;
  world.querySelectorAll('g.node.sel').forEach(x=>x.classList.remove('sel'));
  document.querySelectorAll('.navitem.active').forEach(x=>x.classList.remove('active'));
}

/* pan/zoom: mouse drag + wheel, touch one-finger pan + two-finger pinch */
const pointers=new Map();
let panning=false,px=0,py=0,dragMoved=false,lastPinch=null;
function zoomAt(mx,my,f){
  const nk=Math.min(4,Math.max(0.25,view.k*f));
  view.tx=mx-(mx-view.tx)*(nk/view.k); view.ty=my-(my-view.ty)*(nk/view.k); view.k=nk; applyView();
}
function pinchState(){
  const [a,b]=[...pointers.values()];
  const r=svg.getBoundingClientRect();
  return {d:Math.hypot(a.x-b.x,a.y-b.y), mx:(a.x+b.x)/2-r.left, my:(a.y+b.y)/2-r.top};
}
svg.addEventListener('pointerdown',e=>{
  try{svg.setPointerCapture(e.pointerId);}catch(_){/* pointer may already be gone */}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    panning=true; dragMoved=false; px=e.clientX; py=e.clientY; svg.classList.add('panning');
  }else if(pointers.size===2){
    panning=false; dragMoved=true; lastPinch=pinchState();
  }
});
svg.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2 && lastPinch){
    const p=pinchState();
    if(lastPinch.d>0 && p.d>0) zoomAt(p.mx,p.my,p.d/lastPinch.d);
    view.tx+=p.mx-lastPinch.mx; view.ty+=p.my-lastPinch.my; applyView();
    lastPinch=p;
  }else if(panning){
    const dx=e.clientX-px, dy=e.clientY-py;
    if(Math.abs(dx)+Math.abs(dy)>4) dragMoved=true;
    view.tx+=dx; view.ty+=dy; px=e.clientX; py=e.clientY; applyView();
  }
});
function dropPointer(e,isTap){
  const wasSingle=pointers.size===1;
  pointers.delete(e.pointerId);
  lastPinch=null;
  if(pointers.size===1){
    const [p]=[...pointers.values()];
    panning=true; px=p.x; py=p.y;
  }else if(pointers.size===0){
    panning=false; svg.classList.remove('panning');
    if(isTap && wasSingle && !dragMoved) tapAt(e.clientX,e.clientY);
  }
}
svg.addEventListener('pointerup',e=>dropPointer(e,true));
svg.addEventListener('pointercancel',e=>dropPointer(e,false));
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:0.89);
},{passive:false});
document.getElementById('zin').addEventListener('click',()=>{view.k=Math.min(4,view.k*1.2);applyView();});
document.getElementById('zout').addEventListener('click',()=>{view.k=Math.max(0.25,view.k/1.2);applyView();});
document.getElementById('btnReset').addEventListener('click',()=>{stopTrace(); currentScene?renderScene(currentScene):renderOverview();});
document.getElementById('btnBack').addEventListener('click',goBack);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){ if(tracing)stopTrace(); else if(currentScene)goBack(); else clearSel();}});

/* tabs */
const tabWhat=document.getElementById('tabWhat'), tabHow=document.getElementById('tabHow');
function setTab(t){
  tab=t;
  tabWhat.classList.toggle('on',t==='what'); tabHow.classList.toggle('on',t==='how');
  const w=document.getElementById('tabwhat'), h=document.getElementById('tabhow');
  if(w&&h){w.style.display=t==='what'?'':'none'; h.style.display=t==='how'?'':'none';}
}
tabWhat.addEventListener('click',()=>setTab('what'));
tabHow.addEventListener('click',()=>setTab('how'));

/* sidebar */
const sidebar=document.getElementById('sidebar');
GROUPS.forEach(gr=>{
  const h=document.createElement('h2'); h.textContent=gr.label; sidebar.appendChild(h);
  NODES.filter(n=>n.group===gr.id).forEach(n=>{
    const b=document.createElement('button'); b.className='navitem'; b.dataset.id=n.id;
    const cnt=n.scene?(SCENES[n.scene]?SCENES[n.scene].nodes.length:''):'';
    b.innerHTML=`<span class="code">${n.code}</span>${n.name}${cnt?`<span class="n">${cnt}</span>`:''}`;
    b.addEventListener('click',()=>{
      if(currentScene)renderOverview();
      selectNode(n.id,id=>NODES.find(x=>x.id===id));
    });
    sidebar.appendChild(b);
  });
});

/* ================= trace ================= */
let tracing=false, traceIdx=-1, traceTimer=null, tracer=null, activeTrace=TRACE;
const tracebox=document.getElementById('tracebox');
function litSet(eid,on){
  const p=edgePaths[eid]; if(!p)return;
  p.classList.toggle('lit',on);
  const m=edgeMeta[eid]; if(!m)return;
  world.querySelectorAll('g.node').forEach(g=>{ if(g.dataset.id===m.from||g.dataset.id===m.to) g.classList.toggle('lit',on); });
}
function clearLit(){
  Object.keys(edgePaths).forEach(id=>{const p=edgePaths[id];p.classList.remove('lit');});
  world.querySelectorAll('g.node.lit').forEach(g=>g.classList.remove('lit'));
  world.querySelectorAll('.diam.lit').forEach(d=>d.classList.remove('lit'));
}
function showTraceStep(i){
  clearLit();
  const st=activeTrace[i]; if(!st)return;
  litSet(st.edge,true);
  document.getElementById('tracestep').textContent=st.t;
  document.getElementById('tracetext').textContent=st.x;
  const led=document.getElementById('traceledger');
  if(st.ledger){led.textContent=st.ledger; led.style.display='block';}
  else led.style.display='none';
  tracebox.style.display='block';
  const p=edgePaths[st.edge];
  if(p){
    if(!tracer){tracer=el('circle',{id:'tracer',r:5}); world.appendChild(tracer);}
    world.appendChild(tracer);
    const len=p.getTotalLength(); const t0=performance.now(); const dur=1400;
    const step=(now)=>{
      if(!tracing && traceIdx!==i)return;
      const u=Math.min(1,(now-t0)/dur);
      const pt=p.getPointAtLength(u*len);
      tracer.setAttribute('cx',pt.x); tracer.setAttribute('cy',pt.y);
      if(u<1 && (tracing||traceIdx===i)) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
}
function resolveTrace(){
  // scene with its own flow animates in place; otherwise fall back to the overview loop
  if(currentScene && SCENES[currentScene].trace) return SCENES[currentScene].trace;
  if(currentScene) renderOverview();
  return TRACE;
}
function startTrace(){
  stopTrace();
  activeTrace=resolveTrace();
  clearSel(); tracing=true; traceIdx=0;
  document.getElementById('btnPlay').textContent='⏸ Pause';
  showTraceStep(0);
  traceTimer=setInterval(()=>{
    traceIdx=(traceIdx+1)%activeTrace.length; showTraceStep(traceIdx);
  },2600);
}
function stopTrace(){
  if(!tracing && traceIdx<0)return;
  tracing=false; clearInterval(traceTimer); traceTimer=null;
  document.getElementById('btnPlay').textContent='▶ Trace the loop';
  clearLit();
  tracebox.style.display='none';
  if(tracer&&tracer.parentNode)tracer.parentNode.removeChild(tracer);
  tracer=null; traceIdx=-1;
}
document.getElementById('btnPlay').addEventListener('click',()=>{ tracing?stopTrace():startTrace(); });
document.getElementById('btnStep').addEventListener('click',()=>{
  const tr=resolveTrace();
  if(tracing){clearInterval(traceTimer);tracing=false;document.getElementById('btnPlay').textContent='▶ Trace the loop';}
  if(activeTrace!==tr){activeTrace=tr;traceIdx=-1;}
  clearSel();
  traceIdx=(traceIdx+1)%activeTrace.length;
  showTraceStep(traceIdx);
});

/* boot */
renderOverview();
showWelcome();
window.addEventListener('resize',()=>{ if(!currentScene)fitTo(NODES); });
</script>
