name = "ssp-cf"
main = "build/worker/shim.mjs"
# 2026-10-01 or later: pending service-binding / RPC calls keep the DO alive
# without a connected client.
compatibility_date = "2026-10-01"

# One Durable Object class = the SSP node. One instance per project (keyed by
# the X-Spooky-Project header in the top-level fetch handler).
[[durable_objects.bindings]]
name = "SSP_NODE"
class_name = "SspNodeDo"

# SQLite-backed, as the control plane registers it (timers and metadata live
# in the object's SQLite).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SspNodeDo"]

# Workers Logs + automatic tracing (the JSON lines from src/log.rs).
[observability]
enabled = true

# Non-secret config. The DB stays EXTERNAL — this points at SurrealDB Cloud (or
# any HTTP-RPC SurrealDB). The node talks to it via HttpSqlDb over fetch.
[vars]
SPKY_DB_URL = "https://REPLACE-ME.surreal.cloud"
SPKY_DB_NS = "spooky"
SPKY_DB_DB = "spooky"
SPKY_SSP_ID = "cf-ssp"
# error | warn | info | debug | trace
SPKY_LOG = "info"
# Optional: place the Durable Object near the database (e.g. "weur" for a
# Hetzner-hosted DB). Only applies when the object is first created.
SPKY_DO_LOCATION_HINT = ""

# Secrets (set with `wrangler secret put ...`, never commit):
#   SPKY_DB_AUTH      full Authorization header value, e.g. "Bearer <jwt>"
#   SPKY_AUTH_SECRET  bearer secret the platform uses to call this node

[build]
command = "worker-build --release"
