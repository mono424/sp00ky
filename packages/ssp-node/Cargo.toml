[package]
name = "ssp-node"
version = "0.0.1-canary.348"
edition = "2021"
description = "Portable SSP node core: platform ports (traits) + shared types for the VM (tokio/axum) and Cloudflare (workers-rs) shells"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
# Pinned: the fold and the browser (`loro-crdt` 1.11.0) must decode and
# encode the same way, and a minor bump changes which blobs a decoder accepts.
loro = "=1.11.1"
lru = "0.12"
# ECMAScript `Number#toString` digits for the CRDT state hash (see crdt/hash.rs).
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# `sync` + `macros` only — both wasm32-safe. NEVER add `rt`, `time`, or `net`
# here; runtime concerns live behind the port traits.
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
tracing = "0.1"
web-time = "1"

schedule-core = { path = "../schedule-core" }
push-core = { path = "../push-core" }
# No `mimalloc`: the global allocator is the binary's choice (apps/ssp and
# ssp-portable keep the default), and a library that picks one leaves its
# tests unable to count allocations (tests/view_memory.rs).
ssp = { path = "../ssp", default-features = false, features = ["parallel", "mmap-store"] }
ssp-protocol = { path = "../ssp-protocol" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# ssp → ulid → rand → getrandom: needs the JS backend on wasm32 (paired with
# the rustflags cfg in .cargo/config.toml, same pattern as packages/ssp-wasm).
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
anyhow = "1"
# Embedded in-memory SurrealDB + a mock HTTP backend so the job tests exercise
# the real SQL and dispatch through the Db/HttpClient PORTS, end to end.
# Native-only (tests don't run on the wasm target; the portability gate is a
# plain `cargo check`, which ignores dev-deps).
reqwest = { version = "0.12", features = ["json"] }
surrealdb = { version = "3.1.2", default-features = false, features = ["kv-mem"] }
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
