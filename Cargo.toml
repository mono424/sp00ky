[workspace]
resolver = "2"
members = [
    "apps/ssp",
    "apps/ssp-portable",
    "apps/scheduler",
    "apps/cli",
    "apps/agent",
    "packages/ssp",
    "packages/ssp-protocol",
    "packages/ssp-wasm",
    "packages/ssp-ffi",
    "packages/maintenance",
    "packages/schedule-core",
    "packages/push-core",
    "packages/pool-protocol",
    "packages/pool-core",
    "packages/ssp-node",
]

# loro-internal has a debug assertion (diff_calc) that a valid
# loro-prosemirror document can trip, aborting the process in dev and test
# builds only. Release builds never compile it in.
[profile.dev.package.loro-internal]
debug-assertions = false
