[package]
name = "ssp-ffi"
version = "0.0.1-alpha.1"
edition = "2021"
description = "C ABI (Dart FFI) bindings for ssp"
license = "MIT"

[lib]
# cdylib: loaded via dlopen on Android/Linux/macOS/Windows (libssp_ffi.{so,dylib}/ssp_ffi.dll).
# staticlib: iOS forbids loose dylibs, so there we link libssp_ffi.a into the host
# binary and resolve symbols via DynamicLibrary.process() (see build-native.sh ios).
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
# No mimalloc: its global-allocator per-thread init (mi_thread_init) segfaults
# when this dylib is first loaded in a secondary Dart isolate (observed in the
# multi-suite test runner). The server/CLI keep mimalloc via ssp's default
# features; the client circuit doesn't need it.
ssp = { path = "../ssp", default-features = false, features = ["parallel"] }
libc = "0.2"
