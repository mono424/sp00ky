[package]
name = "ssp"
version = "0.0.1-canary.245"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["parallel", "mimalloc", "mmap-store"]
parallel = ["dep:rayon"]
# File-backed row arena. Enabling the feature only makes the implementation
# available; whether it is used is a runtime decision (see `MmapArena::open`),
# because some deployment substrates have no writable disk at all.
mmap-store = ["dep:memmap2"]
# mimalloc as the global allocator (native, non-wasm). Kept on by default for
# the server/CLI, but disabled by the Dart FFI build: mimalloc's per-thread
# init/teardown segfaults inside a dylib loaded into the Dart VM's multi-isolate
# process. See packages/ssp-ffi.
mimalloc = ["dep:mimalloc"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
ulid = "1.2"
anyhow = "1.0"
blake3 = { version = "1.5", default-features = false, features = ["std"] }
regex = "1.12.2"
lazy_static = "1.4"
nom = "7.1.3"
rustc-hash = "2.1.1"
# Raw hash table. The row index stores only a 12-byte slot per row and
# recovers the key from the arena, which `HashMap` cannot express — its API
# requires the key to live in the table.
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
smol_str = { version = "0.3.1", features = ["serde"] }
rayon = { version = "1.8", optional = true }
smallvec = "1.15.1"
indexmap = { version = "2.13.0", features = ["serde"] }
# Order-statistics set (Fenwick-indexed B-tree): O(log n) select-by-rank via
# `get_index`, so TopK reads its `[offset, offset+limit)` window without an
# O(offset) `iter().skip()`. Core (non-concurrent) path is std-only → wasm-safe;
# the crossbeam/parking_lot deps live behind the `concurrent`/`multimap` features
# we deliberately leave off.
indexset = { version = "0.16", default-features = false }
tracing = "0.1"
ssp-protocol = { path = "../ssp-protocol" }
# Portable monotonic clock for per-phase timing: drop-in std::time on native,
# backed by performance.now() on wasm32 (std::time::Instant panics there).
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.48", optional = true }
# Only exists off wasm32, so `mmap-store` being in the default feature set is
# harmless for the browser, Durable Object and Dart FFI builds — they compile
# the HeapArena path regardless.
memmap2 = { version = "0.9", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["console"] }
