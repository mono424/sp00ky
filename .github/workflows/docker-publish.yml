name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable server image tag (does not publish npm packages)
        required: true
        type: string
  push:
    tags:
      - "sp00ky/v*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_canary: ${{ steps.meta.outputs.is_canary }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Extract version from tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
            [[ "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]] || exit 1
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "channel=" >> "$GITHUB_OUTPUT"
            echo "is_canary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/sp00ky/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # Same three channels as the npm publish: an alpha moves only its own
          # tag, never `canary` and never `latest`.
          if echo "$TAG" | grep -q "alpha"; then
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
            echo "is_canary=false" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -q "canary"; then
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "is_canary=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "is_canary=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - image: mono424/spooky-ssp
            short: ssp
            dockerfile: Dockerfile
            target: ssp
            cache_scope: spooky-rust
            platform: linux/amd64
            runner: ubuntu-latest
          - image: mono424/spooky-ssp
            short: ssp
            dockerfile: Dockerfile
            target: ssp
            cache_scope: spooky-rust
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: mono424/spooky-scheduler
            short: scheduler
            dockerfile: Dockerfile
            target: scheduler
            cache_scope: spooky-rust
            platform: linux/amd64
            runner: ubuntu-latest
          - image: mono424/spooky-scheduler
            short: scheduler
            dockerfile: Dockerfile
            target: scheduler
            cache_scope: spooky-rust
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # The machine pool agent: one static binary, published under the same
          # tag as the scheduler that speaks its protocol. Its own Dockerfile and
          # its own cache scope: writing the shared Rust scope from here would
          # evict the ssp/scheduler dependency cache.
          - image: mono424/spooky-agent
            short: agent
            dockerfile: apps/agent/Dockerfile
            target: ""
            cache_scope: spooky-agent
            platform: linux/amd64
            runner: ubuntu-latest
          - image: mono424/spooky-agent
            short: agent
            dockerfile: apps/agent/Dockerfile
            target: ""
            cache_scope: spooky-agent
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          # Stamped into the scheduler image so it names the agent image of the
          # same tag. Stages that do not declare the arg ignore it.
          build-args: |
            SPKY_VERSION=${{ needs.prepare.outputs.version }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.platform }}
            type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.short }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: mono424/spooky-ssp
            artifact_prefix: ssp
          - image: mono424/spooky-scheduler
            artifact_prefix: scheduler
          - image: mono424/spooky-agent
            artifact_prefix: agent
    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.artifact_prefix }}-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.artifact_prefix }}-arm64
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          TAGS="${{ matrix.image }}:${{ needs.prepare.outputs.version }}"
          if [ -n "${{ needs.prepare.outputs.channel }}" ]; then
            TAGS="$TAGS,${{ matrix.image }}:${{ needs.prepare.outputs.channel }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAG_ARGS=$(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | xargs -I {} echo "-t {}" | tr '\n' ' ')
          docker buildx imagetools create $TAG_ARGS \
            $(printf '${{ matrix.image }}@sha256:%s ' *)
