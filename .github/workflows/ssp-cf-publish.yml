name: Publish ssp-cf worker

# The free/Cloudflare-plan SSP node (`apps/ssp-cf`, a Durable Object) is NOT a
# Docker image, so `docker-publish.yml` never ships it — historically it was
# built + uploaded by hand (`spooky-cloud/scripts/publish-ssp-wasm.sh`), which
# is why the deployed node froze behind the released code. This builds the
# worker on every release tag and registers it with the control plane's
# `base_image_versions` registry (role `ssp-cf`), so the next free-plan deploy
# (or `spky deploy --upgrade`) picks up the new version.
#
# Requires two repo secrets (skips cleanly if the API URL is absent):
#   SPOOKY_API_URL   e.g. https://api-stg.sp00ky.cloud
#   SSP_CF_ADMIN_KEY control-plane admin key (sent as `Authorization: AdminKey …`)

on:
  push:
    tags:
      - "sp00ky/v*"

permissions:
  contents: read

jobs:
  publish-ssp-cf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/sp00ky/v}" >> "$GITHUB_OUTPUT"

      - name: Skip if control-plane API is not configured
        id: guard
        env:
          SPOOKY_API_URL: ${{ secrets.SPOOKY_API_URL }}
        run: |
          if [ -z "$SPOOKY_API_URL" ]; then
            echo "SPOOKY_API_URL not set — skipping ssp-cf publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust (wasm32)
        if: steps.guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        if: steps.guard.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ssp-cf

      - name: Install worker-build
        if: steps.guard.outputs.skip != 'true'
        run: cargo install -q worker-build

      - name: Build ssp-cf worker
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/ssp-cf
        run: worker-build --release

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      # host.mjs is the main module once a project has Worker backends: it
      # loads them as Dynamic Workers and hands everything else to index.js.
      - name: Build the Worker backend host
        if: steps.guard.outputs.skip != 'true'
        working-directory: apps/ssp-cf/js
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -f ../build/host.mjs

      - name: Publish to control-plane registry
        if: steps.guard.outputs.skip != 'true'
        env:
          SPOOKY_API_URL: ${{ secrets.SPOOKY_API_URL }}
          ADMIN_API_KEY: ${{ secrets.SSP_CF_ADMIN_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/ssp-cf/build"
          test -f "$BUNDLE_DIR/index.js" || { echo "missing $BUNDLE_DIR/index.js"; exit 1; }
          test -f "$BUNDLE_DIR/index_bg.wasm" || { echo "missing $BUNDLE_DIR/index_bg.wasm"; exit 1; }
          test -f "$BUNDLE_DIR/host.mjs" || { echo "missing $BUNDLE_DIR/host.mjs"; exit 1; }

          # Base64 the bundle into the JSON payload the admin endpoint expects
          # (matches spooky-cloud/scripts/publish-ssp-wasm.sh). The wasm is
          # ~5.5 MB base64-encoded, which blows past ARG_MAX if passed to `jq
          # --arg` ("jq: Argument list too long"), so build the JSON in python,
          # reading the files directly instead of through the shell arg vector.
          PAYLOAD="$(mktemp)"
          python3 - "$VERSION" "$BUNDLE_DIR/index.js" "$BUNDLE_DIR/index_bg.wasm" "$BUNDLE_DIR/host.mjs" "$PAYLOAD" <<'PY'
          import sys, base64, json
          version, js_path, wasm_path, host_path, out = sys.argv[1:6]
          def b64(path):
              with open(path, "rb") as f:
                  return base64.b64encode(f.read()).decode()
          with open(out, "w") as f:
              json.dump({"version": version, "index_js_b64": b64(js_path),
                         "index_wasm_b64": b64(wasm_path), "host_js_b64": b64(host_path)}, f)
          PY

          echo "Publishing ssp-cf '$VERSION' -> $SPOOKY_API_URL"
          curl -fsS -X POST "$SPOOKY_API_URL/v1/admin/ssp-wasm/versions" \
            -H "Authorization: AdminKey $ADMIN_API_KEY" \
            -H "Content-Type: application/json" \
            --data @"$PAYLOAD"
          echo
