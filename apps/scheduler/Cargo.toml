[package]
name = "scheduler"
version = "0.0.1-canary.370"
edition = "2021"

[dependencies]
schedule-core = { path = "../../packages/schedule-core" }
push-core = { path = "../../packages/push-core", features = ["reqwest"] }
# Machine pools: the engine, its agent wire types, the docker provider (Docker
# Engine API over the local socket, so the scheduler image needs no docker CLI)
# and the HMAC behind per-machine bearer tokens.
pool-core = { path = "../../packages/pool-core" }
pool-protocol = { path = "../../packages/pool-protocol" }
bollard = "0.18"
hmac = "0.12"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
surrealdb = { version = "3.1.2", default-features = false, features = ["kv-rocksdb", "protocol-http", "rustls"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
# `compression-*`: the admin plane gzips/brotlis its JSON and the dashboard
# bundle (the wa-sqlite cache module alone is a 1.1 MB wasm). SSE streams and
# WebSocket upgrades are left alone by the default predicate.
tower-http = { version = "0.6", features = ["timeout", "fs", "cors", "compression-gzip", "compression-br"] }
# `util` for `ServiceExt::oneshot`: the MCP server dispatches tool calls
# through the admin router in-process rather than re-implementing handlers.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
ssp-protocol = { path = "../../packages/ssp-protocol", features = ["console-grant"] }
maintenance = { path = "../../packages/maintenance" }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
flate2 = "1"
crc32fast = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
sha2 = "0.10"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# The live socket tests (`/admin/api/v2/live`). The version axum's `ws`
# feature already builds, so the test client adds no second copy.
tokio-tungstenite = "0.24"
